# 本固件为 LEDE 自编译（内核与包均为自编译版本），官方 opkg 源与本固件
# 内核/ABI 不匹配（kmod 无法安装，普通包有依赖冲突风险），故默认禁用全部官方源。
#
# 安装软件请使用 Release 中与本镜像同批编译的 packages-<device>.tar.gz 做本地源：
#   tar xzf packages-x86.tar.gz -C /opt
#   echo "src/gz mykmod file:///opt/packages" >> /etc/opkg/customfeeds.conf
#   echo "src/gz mybase file:///opt/packages/base" >> /etc/opkg/customfeeds.conf
#   echo "src/gz myluci file:///opt/packages/luci" >> /etc/opkg/customfeeds.conf
#   echo "src/gz mypkgs file:///opt/packages/packages" >> /etc/opkg/customfeeds.conf
#   echo "src/gz myhello file:///opt/packages/helloworld" >> /etc/opkg/customfeeds.conf
#   opkg update && opkg install <包名>
#
# 如确需官方源（仅限纯用户态软件、自担风险），取消下面注释：
# src/gz openwrt_core https://downloads.openwrt.org/releases/24.10.5/targets/x86/64/packages
# src/gz openwrt_base https://downloads.openwrt.org/releases/24.10.5/packages/x86_64/base
# src/gz openwrt_luci https://downloads.openwrt.org/releases/24.10.5/packages/x86_64/luci
# src/gz openwrt_packages https://downloads.openwrt.org/releases/24.10.5/packages/x86_64/packages
# src/gz openwrt_routing https://downloads.openwrt.org/releases/24.10.5/packages/x86_64/routing
